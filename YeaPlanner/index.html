<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>YeaPlanner</title>
  </head>
  <body>
    <header>
      <img class="header_logo" src="images/Logo.svg" alt="Logo" />
    </header>
    <main>
      <form class="task-form">
        <input
          type="text"
          class="task-form_input"
          placeholder="Введите новую задачу"
          aria-label="новая задача"
          required
        />
        <button class="task_submit-btn" type="submit">
          Создать <img src="images/plus.svg" alt="" />
        </button>
      </form>
      <section class="tasklist">
        <div class="tasklist-header">
          <div class="tasklist-active">
            <p class="tasklist-active_text">Активных задач</p>
            <span class="tasklist-active_count">0</span>
          </div>
          <div class="tasklist-resolved">
            <p class="tasklist-resolved_text">Решенных задач</p>
            <span class="tasklist-resolved_count">0</span>
          </div>
        </div>
        <div class="tasklist-block">
          <ul class="tasklist-list is-hidden"></ul>
          <div class="tasklist-empty">
            <img
              class="tasklist-list_empty-image"
              src="images/Clipboard.svg"
              alt=""
            />
            <p class="tasklist-list_empty">
              <strong>У вас еще нет зарегистрированных задач</strong><br />
              Создавайте задачи и организуйте свои дела
            </p>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
